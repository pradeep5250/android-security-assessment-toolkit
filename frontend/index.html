<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Android Security Assessment Toolkit — Professional security testing and analysis dashboard">
    <meta name="theme-color" content="#06080f">
    <title>ASAT — Android Security Toolkit</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/dashboard.css">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <style>
        /* Initial loading state */
        .app-loading {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }
        .app-loading.fade-out { opacity: 0; pointer-events: none; }
        .app-loading .loading-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            animation: glowPulse 2s infinite;
        }
        .app-loading .loading-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .app-loading .loading-bar {
            width: 200px; height: 3px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .app-loading .loading-bar-fill {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 10px;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="app-loading" id="app-loading">
        <div class="loading-icon">🛡️</div>
        <div class="loading-text">Initializing ASAT...</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>

    <!-- Login Page (shown when not authenticated) -->
    <div id="login-page" class="hidden">
        <div class="login-container">
            <div class="login-card">
                <div class="login-logo">
                    <div class="logo-icon">🛡️</div>
                    <h1>ASAT</h1>
                    <p>Android Security Assessment Toolkit</p>
                </div>

                <div id="login-form-container">
                    <!-- Login Form -->
                    <form class="login-form" id="login-form">
                        <div class="form-group">
                            <label class="form-label" for="login-username">Username</label>
                            <input class="form-input" type="text" id="login-username" placeholder="Enter your username" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="login-password">Password</label>
                            <input class="form-input" type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
                        </div>
                        <button class="btn btn-primary btn-lg" type="submit" id="login-submit" style="width:100%">
                            Sign In
                        </button>
                        <p class="text-center text-muted" style="font-size:0.8rem; margin-top:0.5rem">
                            No account? <a href="#" id="show-register">Register here</a>
                        </p>
                    </form>

                    <!-- Register Form (hidden by default) -->
                    <form class="login-form hidden" id="register-form">
                        <div class="form-group">
                            <label class="form-label" for="reg-username">Username</label>
                            <input class="form-input" type="text" id="reg-username" placeholder="Choose a username" required minlength="3" pattern="[a-zA-Z0-9_]+">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="reg-email">Email</label>
                            <input class="form-input" type="email" id="reg-email" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="reg-password">Password</label>
                            <input class="form-input" type="password" id="reg-password" placeholder="Minimum 8 characters" required minlength="8">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="reg-fullname">Full Name (optional)</label>
                            <input class="form-input" type="text" id="reg-fullname" placeholder="Your full name">
                        </div>
                        <button class="btn btn-primary btn-lg" type="submit" id="register-submit" style="width:100%">
                            Create Account
                        </button>
                        <p class="text-center text-muted" style="font-size:0.8rem; margin-top:0.5rem">
                            Already have an account? <a href="#" id="show-login">Sign in</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard (shown when authenticated) -->
    <div id="app-container" class="app-container hidden">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">🛡️</div>
                <div>
                    <div class="brand-text">ASAT</div>
                    <div class="brand-version">v1.0.0</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a class="nav-item active" href="#dashboard" data-page="dashboard">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">Dashboard</span>
                    </a>
                    <a class="nav-item" href="#devices" data-page="devices">
                        <span class="nav-icon">📱</span>
                        <span class="nav-label">Devices</span>
                        <span class="badge badge-info nav-badge" id="device-count-badge">0</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Tools</div>
                    <a class="nav-item" href="#adb" data-page="adb">
                        <span class="nav-icon">💻</span>
                        <span class="nav-label">ADB Terminal</span>
                    </a>
                    <a class="nav-item" href="#scanner" data-page="scanner">
                        <span class="nav-icon">🔍</span>
                        <span class="nav-label">Network Scanner</span>
                    </a>
                    <a class="nav-item" href="#apk-analysis" data-page="apk-analysis">
                        <span class="nav-icon">📦</span>
                        <span class="nav-label">APK Analysis</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Reports</div>
                    <a class="nav-item" href="#reports" data-page="reports">
                        <span class="nav-icon">📄</span>
                        <span class="nav-label">Reports</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">System</div>
                    <a class="nav-item" href="#settings" data-page="settings">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-label">Settings</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button class="sidebar-toggle" id="sidebar-toggle" data-tooltip="Toggle sidebar">
                    ◀
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="app-header">
                <div class="header-left">
                    <h2 class="page-title" id="page-title">Dashboard</h2>
                </div>
                <div class="header-right">
                    <div class="search-box header-search">
                        <span class="search-icon">🔎</span>
                        <input type="text" placeholder="Search..." id="global-search">
                    </div>
                    <div class="dropdown">
                        <div class="user-menu" id="user-menu-toggle">
                            <div class="user-avatar" id="user-avatar">A</div>
                            <div class="user-info">
                                <div class="user-name" id="user-display-name">Admin</div>
                                <div class="user-role" id="user-display-role">admin</div>
                            </div>
                        </div>
                        <div class="dropdown-menu" id="user-dropdown">
                            <button class="dropdown-item" id="btn-profile">
                                <span>👤</span> Profile
                            </button>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item" id="btn-logout" style="color: var(--color-danger)">
                                <span>🚪</span> Logout
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic Page Content -->
            <div class="page-content" id="page-content">
                <!-- Pages are rendered here by the SPA router -->
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- JavaScript -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/chart.js"></script>
    <script src="/js/components/log-viewer.js"></script>
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/devices.js"></script>
    <script src="/js/pages/adb.js"></script>
    <script src="/js/pages/scanner.js"></script>
    <script src="/js/pages/apk-analysis.js"></script>
    <script src="/js/pages/reports.js"></script>
    <script src="/js/pages/settings.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
